<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Machan Codes</title>
  <meta name="description" content="Home page of Machan Codes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafaf9;
      --fg: #1c1917;
      --muted: #78716c;
      --line: #e7e5e4;
      --accent: #ea580c;
      --card: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0a09;
        --fg: #f5f5f4;
        --muted: #a8a29e;
        --line: #292524;
        --accent: #fb923c;
        --card: #1c1917;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 96px 24px 48px;
      flex: 1;
    }
    .tag {
      font-family: "JetBrains Mono", monospace;
      font-size: 14px;
      color: var(--accent);
    }
    h1 {
      font-size: clamp(40px, 8vw, 64px);
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin: 12px 0 20px;
    }
    .lead {
      font-size: 19px;
      color: var(--muted);
      max-width: 52ch;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }
    .links a {
      color: var(--fg);
      text-decoration: none;
      font-weight: 500;
      padding: 10px 18px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      transition: border-color .15s, color .15s;
    }
    .links a:hover { border-color: var(--accent); color: var(--accent); }
    h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin: 72px 0 16px;
    }
    .projects { display: grid; gap: 12px; }
    .project {
      display: block;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      color: inherit;
      text-decoration: none;
      transition: border-color .15s;
    }
    .project:hover { border-color: var(--accent); }
    .project strong { display: block; margin-bottom: 4px; }
    .project span { color: var(--muted); font-size: 15px; }
    footer {
      text-align: center;
      padding: 32px 24px;
      color: var(--muted);
      font-size: 14px;
      border-top: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <main>
    <p class="tag">// hello, world</p>
    <h1>Machan Codes</h1>
    <p class="lead">I build things for the web. This is my corner of the internet, where I share projects, experiments and notes.</p>

    <nav class="links">
      <a href="https://github.com/machancodes">GitHub</a>
      <a href="mailto:machan.codes@gmail.com">Email</a>
    </nav>

    <h2>Projects</h2>
    <div class="projects">
      <a class="project" href="https://github.com/machancodes/machancodes.github.io">
        <strong>machancodes.github.io</strong>
        <span>This site. Plain HTML and CSS, hosted on GitHub Pages.</span>
      </a>
    </div>
  </main>

  <footer>&copy; <span id="year">2026</span> Machan Codes</footer>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
